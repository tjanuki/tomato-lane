# Local development database. Mirrors production on caws:
# PostgreSQL 16, UTF8 encoding, C.UTF-8 locale.
services:
    postgres:
        image: postgres:16
        container_name: tomato-lane-postgres
        restart: unless-stopped
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_USER: tomato_lane
            POSTGRES_PASSWORD: tomato_lane
            POSTGRES_DB: tomato_lane
            POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U tomato_lane -d tomato_lane']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres-data:
